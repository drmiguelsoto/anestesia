<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honorarios de Anestesia · Dr. Miguel Soto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--negro:#030707;--taupe:#A19487;--crema:#F4F2F1;--linea:#E2DCD6;--tinta:#2A2C2C;--gris:#6F6A66;--ok:#3E6B4E;--alerta:#9A5B2E;--error:#8E2F2F;--azul:#3C5A73}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tinta);font-family:Jost,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0;color:var(--negro)}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--negro);background:#fff;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:38px;height:38px;border:1px solid var(--negro);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500}
.word{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:4px;font-weight:500}
.word small{display:block;font-family:Jost;font-size:9px;letter-spacing:2.5px;color:var(--taupe);text-transform:uppercase}
.who{font-size:12px;color:var(--gris);text-align:right}
.who a{color:var(--taupe);cursor:pointer}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--linea);overflow-x:auto;background:#fff}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;color:var(--gris);letter-spacing:.5px;white-space:nowrap}
nav button.on{color:var(--negro);border-color:var(--negro);font-weight:500}
nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--crema);font-size:11px;color:var(--negro)}
main{max-width:1100px;margin:0 auto;padding:24px}
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);margin-bottom:6px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hero h1{font-size:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--linea);background:#fff;padding:5px 12px;border-radius:20px;color:var(--gris);font-size:12px}
.chip.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.lista{border-top:1px solid var(--linea)}
.fila{display:grid;grid-template-columns:110px 1fr 150px 110px 120px;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--linea);cursor:pointer}
.fila:hover{background:#FAF8F7}
.fila .pac{font-weight:500;color:var(--negro)}
.fila .proc{font-size:12px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .monto{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.fecha{font-size:12px;color:var(--gris)}
.estado{display:inline-block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--crema);color:var(--negro);text-align:center}
.e-Por_confirmar{background:#F3E9DE;color:var(--alerta)}.e-Por_aprobar{background:#E6ECF1;color:var(--azul)}.e-Aprobado{background:#E4EEE7;color:var(--ok)}
.e-En_cobro{background:#EDE8F2;color:#5B4B73}.e-Pagado{background:var(--negro);color:var(--crema)}.e-Excluido,.e-Rechazado{background:#F0EDEB;color:#9C9590}.e-Programado{background:#fff;border:1px solid var(--linea);color:var(--gris)}
.vacio{padding:48px 0;text-align:center;color:var(--gris)}
.btn{background:var(--negro);color:var(--crema);border:1px solid var(--negro);padding:9px 16px;letter-spacing:.6px}
.btn.sec{background:#fff;color:var(--negro)}
.btn.peligro{background:#fff;color:var(--error);border-color:var(--error)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{border:1px solid var(--linea);padding:18px;margin-bottom:16px;background:#fff}
.panel.crema{background:var(--crema);border-color:var(--crema)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--crema);padding:16px}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--negro)}
.kpi .l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe);text-align:left;font-weight:500;padding:8px 6px;border-bottom:1px solid var(--negro)}
td{padding:9px 6px;border-bottom:1px solid var(--linea);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--crema);color:var(--gris)}
.tag.ag{background:#E6ECF1;color:var(--azul)}.tag.an{background:#F3E9DE;color:var(--alerta)}.tag.ap{background:#E4EEE7;color:var(--ok)}
.tachado td{opacity:.4;text-decoration:line-through}
.sinmap{color:var(--error);font-weight:500}
.drawer{position:fixed;inset:0;background:rgba(3,7,7,.35);display:none;z-index:20}
.drawer.on{display:block}
.drawer .hoja{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:#fff;overflow-y:auto;padding:26px 28px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.cerrar{position:absolute;right:18px;top:14px;background:none;border:0;font-size:26px;color:var(--gris)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;margin:12px 0 18px}
.meta b{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--taupe);font-weight:500}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.ctrl small{display:block;color:var(--gris);font-size:11.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:1px solid var(--linea);background:#fff}
.switch{position:relative;width:40px;height:22px;background:#DDD6D0;border-radius:11px;border:0;flex:none}
.switch.on{background:var(--negro)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:21px}
.switch:disabled{opacity:.4}
.desglose{background:var(--crema);padding:14px 16px;margin:16px 0}
.desglose div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.desglose .tot{border-top:1px solid var(--negro);margin-top:6px;padding-top:8px;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--negro)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.aviso{padding:10px 12px;font-size:12.5px;margin:10px 0;border-left:3px solid var(--alerta);background:#FBF6F1}
.aviso.err{border-color:var(--error);background:#FBF2F2;color:var(--error)}
.aviso.ok{border-color:var(--ok);background:#F2F7F3;color:var(--ok)}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--taupe)}
.campo input,.campo select,.campo textarea{border:1px solid var(--linea);padding:9px 10px;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--negro);color:var(--crema);padding:11px 18px;font-size:13px;z-index:40;display:none;max-width:90%}
.toast.err{background:var(--error)}
.login{max-width:420px;margin:12vh auto;text-align:center;padding:0 24px}
.login h1{font-size:40px;margin:8px 0 10px}
.login p{color:var(--gris)}
#gbtn{display:flex;justify-content:center;margin-top:26px}
.cargando{opacity:.5;pointer-events:none}
@media (max-width:720px){
  .fila{grid-template-columns:1fr auto;grid-template-areas:'pac monto' 'proc estado' 'fecha anest'}
  .fila .pac{grid-area:pac}.fila .proc{grid-area:proc}.fila .monto{grid-area:monto}.fila .est{grid-area:estado;text-align:right}.fila .fecha{grid-area:fecha}.fila .an{grid-area:anest;text-align:right}
  main{padding:16px}.top{padding:12px 16px}nav{padding:0 10px}.grid2,.meta{grid-template-columns:1fr}.word small{display:none}
  .drawer .hoja{padding:22px 16px 40px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer" id="drawer"><div class="hoja"><button class="cerrar" onclick="cerrarCaso()">×</button><div id="detalle"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyQzreXfVYijommhkd4mdnejSD_j5qr-ZT2fk5Ud9TEZhbkhcmgxM5xJip80vDCXy30Zg/exec';
const CLIENT_ID = '634352012698-b47t3ed3tvd4d1g7l30l68bd6e5s0ri4.apps.googleusercontent.com';

const S = { token: null, yo: null, cat: null, vista: '', filtro: '', casos: [], sols: [], eqs: [], tablero: null, caso: null, sel: new Set() };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mx = n => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const ESTADO_TXT = { Programado: 'Programado', Por_confirmar: 'Por confirmar', Por_aprobar: 'Por aprobar', Aprobado: 'Aprobado', En_cobro: 'En cobro', Pagado: 'Pagado', Excluido: 'Excluido', Rechazado: 'Rechazado', Por_pagar: 'Por pagar', Pagada: 'Pagada', Rechazada: 'Rechazada' };
const tiene = r => S.yo && S.yo.roles.includes(r);

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2600); }

async function api(accion, datos) {
  const res = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken: S.token, accion, datos: datos || {} }) });
  const j = await res.json();
  if (!j.ok) {
    if (/Sesión|Token|vencida/i.test(j.error)) { salir(true); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ---------- Sesión ---------- */
function pintarLogin(msg) {
  $('#app').innerHTML = `<div class="login"><div class="mono" style="margin:0 auto">MS</div>
  <div class="eyebrow" style="margin-top:22px">Dr. Miguel Soto</div><h1>Honorarios de <em>Anestesia</em></h1>
  <p>Casos de la agenda, validación del tabulador, factura y pago en un solo lugar.</p>
  ${msg ? `<div class="aviso err">${esc(msg)}</div>` : ''}<div id="gbtn"></div></div>`;
  const ini = () => {
    if (!window.google || !google.accounts) return setTimeout(ini, 150);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => entrar(r.credential), auto_select: true });
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'es' });
    google.accounts.id.prompt();
  };
  ini();
}

async function entrar(token) {
  S.token = token;
  try { sessionStorage.setItem('ane_tok', token); } catch (e) { }
  try {
    S.yo = await api('sesion');
    S.cat = await api('catalogo');
    S.vista = tiene('aprobador') ? 'aprobar' : (tiene('pagador') ? 'pagos' : 'mis');
    await cargarVista();
  } catch (e) { S.token = null; pintarLogin(e.message); }
}

function salir(vencida) {
  S.token = null; S.yo = null;
  try { sessionStorage.removeItem('ane_tok'); } catch (e) { }
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  pintarLogin(vencida ? 'Tu sesión venció. Vuelve a entrar.' : '');
}

/* ---------- Estructura ---------- */
function tabs() {
  const t = [];
  if (tiene('anestesiologo')) { t.push(['mis', 'Mis casos']); t.push(['cobrar', 'Cobrar']); }
  if (tiene('aprobador')) { t.push(['aprobar', 'Por aprobar']); t.push(['todos', 'Todos los casos']); t.push(['equiv', 'Equivalencias']); }
  if (tiene('pagador')) t.push(['pagos', 'Pagos']);
  t.push(['tablero', 'Tablero']);
  return t;
}

function marco(contenido) {
  $('#app').innerHTML = `<div class="top"><div class="brand"><div class="mono">MS</div><div class="word">DR. MIGUEL SOTO<small>Honorarios de anestesia</small></div></div>
  <div class="who">${esc(S.yo.nombre)}<br><a onclick="salir()">Salir</a></div></div>
  <nav>${tabs().map(([k, n]) => `<button class="${S.vista === k ? 'on' : ''}" onclick="irA('${k}')">${n}</button>`).join('')}</nav>
  <main>${contenido}</main>`;
}

async function irA(v) { S.vista = v; S.filtro = ''; S.sel.clear(); await cargarVista(); }

async function cargarVista() {
  marco('<div class="vacio">Cargando…</div>');
  try {
    if (['mis', 'aprobar', 'todos', 'cobrar'].includes(S.vista)) S.casos = await api('casos');
    if (S.vista === 'pagos' || S.vista === 'cobrar') S.sols = await api('solicitudes');
    if (S.vista === 'equiv') S.eqs = await api('equivalencias');
    if (S.vista === 'tablero') S.tablero = await api('tablero');
    pintar();
  } catch (e) { marco(`<div class="aviso err">${esc(e.message)}</div>`); }
}

function pintar() {
  const v = S.vista;
  if (v === 'mis') return vistaMis();
  if (v === 'aprobar') return vistaAprobar();
  if (v === 'todos') return vistaTodos();
  if (v === 'cobrar') return vistaCobrar();
  if (v === 'pagos') return vistaPagos();
  if (v === 'equiv') return vistaEquiv();
  if (v === 'tablero') return vistaTablero();
}

/* ---------- Listas de casos ---------- */
function nombreAnest(email) {
  if (!email) return 'Sin asignar';
  const a = (S.cat.anestesiologos || []).find(x => x.email.toLowerCase() === String(email).toLowerCase());
  return a ? a.nombre : email;
}

function filaCaso(c, opts = {}) {
  const sm = Number(c.Sin_Mapear) > 0 ? ' <span class="sinmap">· sin clasificar</span>' : '';
  return `<div class="fila" onclick="abrirCaso('${c.Caso_ID}')">
    <div class="fecha">${esc(String(c.Fecha_Cirugia).slice(0, 10))}<br>${esc(c.Sede || '')}</div>
    <div><div class="pac">${esc(c.Paciente)}</div><div class="proc">${esc(c.Texto_Agenda || '')}${sm}</div></div>
    <div class="an fecha">${opts.anest ? esc(nombreAnest(c.Anestesiologo_Email)) : esc(c.Tipo_Anestesia || '')}</div>
    <div class="est"><span class="estado e-${c.Estado}">${ESTADO_TXT[c.Estado] || c.Estado}</span></div>
    <div class="monto">${mx(c.Total)}</div></div>`;
}

function chips(opciones, conteo) {
  return `<div class="chips">${opciones.map(([k, n]) => `<button class="chip ${S.filtro === k ? 'on' : ''}" onclick="S.filtro='${k}';pintar()">${n}${conteo[k] !== undefined ? ' · ' + conteo[k] : ''}</button>`).join('')}</div>`;
}

function vistaMis() {
  const mios = S.casos.filter(c => String(c.Anestesiologo_Email).toLowerCase() === S.yo.email);
  const libres = S.casos.filter(c => !c.Anestesiologo_Email && c.Estado === 'Por_confirmar');
  const grupos = { Por_confirmar: [], Por_aprobar: [], Aprobado: [], En_cobro: [], Pagado: [], Programado: [] };
  mios.forEach(c => { if (grupos[c.Estado]) grupos[c.Estado].push(c); });
  const conteo = {}; Object.keys(grupos).forEach(k => conteo[k] = grupos[k].length); conteo.libres = libres.length;
  if (!S.filtro) S.filtro = 'Por_confirmar';
  const lista = S.filtro === 'libres' ? libres : (grupos[S.filtro] || []);
  marco(`<div class="hero"><div><div class="eyebrow">Anestesiología</div><h1>Mis casos</h1></div>
    <div class="fecha">Los casos se cargan solos de la agenda de cirugías.</div></div>
    ${chips([['Por_confirmar', 'Por confirmar'], ['Por_aprobar', 'En revisión'], ['Aprobado', 'Aprobados'], ['En_cobro', 'En cobro'], ['Pagado', 'Pagados'], ['Programado', 'Próximos'], ['libres', 'Sin asignar']], conteo)}
    ${S.filtro === 'libres' ? '<div class="aviso">Cirugías de la agenda sin anestesiólogo identificado. Si diste tú la anestesia, ábrela y márcala como tuya.</div>' : ''}
    <div class="lista">${lista.map(c => filaCaso(c)).join('') || '<div class="vacio">Nada por aquí.</div>'}</div>`);
}

function vistaAprobar() {
  const pend = S.casos.filter(c => c.Estado === 'Por_aprobar');
  const conf = S.casos.filter(c => c.Estado === 'Por_confirmar');
  const sinAsig = conf.filter(c => !c.Anestesiologo_Email);
  const sinMap = S.casos.filter(c => Number(c.Sin_Mapear) > 0 && ['Por_confirmar', 'Por_aprobar', 'Programado'].includes(c.Estado));
  if (!S.filtro) S.filtro = 'pend';
  const mapa = { pend, conf, sinAsig, sinMap };
  marco(`<div class="hero"><div><div class="eyebrow">Aprobación</div><h1>Por aprobar</h1></div>
    <div><button class="btn sec" onclick="sincronizarAhora()">Leer agenda ahora</button>
    <div class="fecha" style="margin-top:6px;text-align:right">Última lectura: ${esc(S.yo.ultimaSinc || '—')}</div></div></div>
    ${chips([['pend', 'Confirmados por el anestesiólogo'], ['conf', 'Esperando al anestesiólogo'], ['sinAsig', 'Sin anestesiólogo'], ['sinMap', 'Sin clasificar']], { pend: pend.length, conf: conf.length, sinAsig: sinAsig.length, sinMap: sinMap.length })}
    <div class="lista">${(mapa[S.filtro] || []).map(c => filaCaso(c, { anest: true })).join('') || '<div class="vacio">Nada pendiente.</div>'}</div>`);
}

function vistaTodos() {
  const est = ['activos', 'Programado', 'Por_confirmar', 'Por_aprobar', 'Aprobado', 'En_cobro', 'Pagado', 'Excluido', 'todos'];
  const activos = S.casos.filter(c => c.Estado !== 'Excluido');
  const conteo = { activos: activos.length, todos: S.casos.length };
  est.forEach(e => { if (!(e in conteo)) conteo[e] = S.casos.filter(c => c.Estado === e).length; });
  if (!S.filtro) S.filtro = 'activos';
  const lista = S.filtro === 'activos' ? activos : (S.filtro === 'todos' ? S.casos : S.casos.filter(c => c.Estado === S.filtro));
  const nombres = { activos: 'Vigentes', todos: 'Todos' };
  marco(`<div class="hero"><div><div class="eyebrow">Agenda de cirugías</div><h1>Todos los casos</h1></div></div>
  ${chips(est.map(e => [e, nombres[e] || ESTADO_TXT[e]]), conteo)}
  <div class="lista">${lista.map(c => filaCaso(c, { anest: true })).join('') || '<div class="vacio">Sin casos.</div>'}</div>`);
}

/* ---------- Detalle de caso ---------- */
async function abrirCaso(id) {
  $('#drawer').classList.add('on');
  $('#detalle').innerHTML = '<div class="vacio">Cargando…</div>';
  try { S.caso = await api('caso', { id }); pintarCaso(); } catch (e) { $('#detalle').innerHTML = `<div class="aviso err">${esc(e.message)}</div>`; }
}
function cerrarCaso() { $('#drawer').classList.remove('on'); S.caso = null; cargarVista(); }

function pintarCaso() {
  const { caso: c, lineas } = S.caso;
  const mio = String(c.Anestesiologo_Email).toLowerCase() === S.yo.email;
  const anestEdita = tiene('anestesiologo') && mio && c.Estado === 'Por_confirmar';
  const aprobEdita = tiene('aprobador') && ['Programado', 'Por_confirmar', 'Por_aprobar', 'Rechazado', 'Excluido'].includes(c.Estado);
  const edita = anestEdita || aprobEdita;
  const opciones = S.cat.tabulador.filter(t => t.tipo === 'Procedimiento' || t.tipo === 'Sedacion');
  const optHtml = (sel) => `<option value="">Elige del tabulador…</option>` + ['Rostro', 'Mama', 'Contorno corporal', 'Genital', 'Otros', 'Sedación', 'Sin cargo'].map(cat => {
    const items = S.cat.tabulador.filter(t => t.categoria === cat && (t.tipo !== 'Cargo'));
    return items.length ? `<optgroup label="${cat}">${items.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.concepto)} · ${mx(t.monto)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  const tag = o => o === 'Agenda' ? '<span class="tag ag">Agenda</span>' : (o === 'Anestesiologo' ? '<span class="tag an">Anestesiólogo</span>' : '<span class="tag ap">Aprobador</span>');
  const base = S.cat.tabulador.find(t => t.id === c.Base_Concepto);
  const vpaTxt = { 'Sí': 'Realizada según la agenda', 'Sin marcar': 'Hay VPA en la agenda, sin asistencia marcada', 'Sin VPA': 'No hay VPA en la agenda', 'No': 'La paciente no asistió a la VPA' }[c.VPA_Agenda] || c.VPA_Agenda;

  $('#detalle').innerHTML = `
  <div class="eyebrow">${esc(c.Caso_ID)} · <span class="estado e-${c.Estado}">${ESTADO_TXT[c.Estado]}</span></div>
  <h2 style="font-size:28px">${esc(c.Paciente)}</h2>
  <div class="meta">
    <div><b>Fecha</b>${esc(c.Fecha_Cirugia)}</div><div><b>Sede</b>${esc(c.Sede || '—')}</div>
    <div><b>Anestesia</b>${esc(c.Tipo_Anestesia || '—')}</div><div><b>Cotización</b>${esc(c.COT || '—')}</div>
    <div style="grid-column:1/-1"><b>Agenda</b>${esc(c.Texto_Agenda || '—')}</div>
    <div style="grid-column:1/-1"><b>Anestesiólogo</b>${tiene('aprobador') && aprobEdita
      ? `<select onchange="marcar({anestesiologo:this.value})" style="margin-top:4px;padding:6px;border:1px solid var(--linea)"><option value="">Sin asignar</option>${S.cat.anestesiologos.map(a => `<option value="${esc(a.email)}" ${a.email.toLowerCase() === String(c.Anestesiologo_Email).toLowerCase() ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select>`
      : esc(nombreAnest(c.Anestesiologo_Email))}</div>
  </div>
  ${c.Motivo ? `<div class="aviso">${esc(c.Motivo)}</div>` : ''}
  ${!c.Anestesiologo_Email && tiene('anestesiologo') && c.Estado === 'Por_confirmar' ? `<div class="aviso">Este caso no tiene anestesiólogo en la agenda. <button class="btn" style="margin-left:8px" onclick="accion('reclamar')">Yo di esta anestesia</button></div>` : ''}

  <h3 style="font-size:19px;margin-top:8px">Procedimientos</h3>
  <table><thead><tr><th>Origen</th><th>Procedimiento</th><th class="num">Tabulador</th><th></th></tr></thead><tbody>
  ${lineas.map(l => `<tr class="${l.activa ? '' : 'tachado'}"><td>${tag(l.origen)}</td>
    <td>${esc(l.texto)}${l.concepto ? (l.conceptoNombre && l.conceptoNombre !== l.texto ? `<br><span class="fecha">→ ${esc(l.conceptoNombre)}</span>` : '') :
      (tiene('aprobador') && aprobEdita ? `<br><select onchange="mapear('${l.id}',this.value)" style="margin-top:4px;padding:5px;border:1px solid var(--error);max-width:100%">${optHtml('')}</select>` : '<br><span class="sinmap">Sin clasificar (lo clasifica el aprobador)</span>')}</td>
    <td class="num">${l.monto == null ? '—' : mx(l.monto)}</td>
    <td class="num">${(aprobEdita || (anestEdita && l.origen === 'Anestesiologo')) ? `<button class="btn sec" style="padding:4px 9px" onclick="quitar('${l.id}')">${l.activa ? 'Quitar' : 'Restaurar'}</button>` : ''}</td></tr>`).join('')}
  </tbody></table>
  ${edita ? `<div style="display:flex;gap:8px;margin-top:10px"><select id="nuevoProc" style="flex:1;padding:9px;border:1px solid var(--linea)">${optHtml('')}</select><button class="btn" onclick="agregar()">Agregar</button></div>` : ''}

  <div style="margin-top:18px">
    <div class="ctrl"><div>Médico externo<small>Otro cirujano hizo un procedimiento en el mismo acto (ej. hernia umbilical)</small></div>
      <div class="stepper"><button ${edita ? '' : 'disabled'} onclick="marcar({externos:${Math.max(0, Number(c.Medicos_Externos) - 1)}})">−</button><b>${Number(c.Medicos_Externos) || 0}</b><button ${edita ? '' : 'disabled'} onclick="marcar({externos:${(Number(c.Medicos_Externos) || 0) + 1}})">+</button></div></div>
    <div class="ctrl"><div>Valoración preanestésica<small>${esc(vpaTxt)}</small></div>
      <button class="switch ${c.VPA_Cobra === 'Sí' ? 'on' : ''}" ${edita && (aprobEdita || c.VPA_Agenda !== 'Sin VPA') ? '' : 'disabled'} onclick="marcar({vpa:${c.VPA_Cobra === 'Sí' ? 'false' : 'true'}})"></button></div>
    <div class="ctrl"><div>Reintervención<small>Hematoma o reoperación de una cirugía propia previa. Paga ${mx((S.cat.tabulador.find(t => t.id === 'X_REINT') || {}).monto)} en lugar de la base.</small>
      ${c.Reintervencion === 'Sí' ? `<small>Cirugía original: ${esc(c.Reintervencion_Ref || '—')}</small>` : ''}</div>
      <button class="switch ${c.Reintervencion === 'Sí' ? 'on' : ''}" ${edita ? '' : 'disabled'} onclick="toggleReint()"></button></div>
  </div>

  <div class="desglose">
    <div><span>Base · ${esc(c.Base_Concepto === 'X_REINT' ? 'Reintervención' : (base ? base.concepto : '—'))}</span><span>${mx(c.Base_Monto)}</span></div>
    <div><span>Procedimientos adicionales × ${Number(c.Adicionales_N) || 0}</span><span>${mx(c.Adicionales_Monto)}</span></div>
    <div><span>Médico externo × ${Number(c.Medicos_Externos) || 0}</span><span>${mx(c.Externos_Monto)}</span></div>
    <div><span>Valoración preanestésica</span><span>${mx(c.VPA_Monto)}</span></div>
    <div class="tot"><span>Total</span><span>${mx(c.Total)}</span></div>
  </div>
  ${Number(c.Sin_Mapear) > 0 ? '<div class="aviso err">Hay procedimientos sin clasificar: el total todavía no los incluye.</div>' : ''}

  <div class="acciones">
    ${anestEdita ? `<button class="btn" onclick="accion('confirmar')" ${Number(c.Sin_Mapear) > 0 ? 'disabled' : ''}>Confirmar y enviar a aprobación</button>` : ''}
    ${tiene('aprobador') && ['Por_aprobar', 'Por_confirmar'].includes(c.Estado) ? `<button class="btn" onclick="accion('aprobar')">Aprobar ${mx(c.Total)}</button><button class="btn sec" onclick="rechazar(false)">Regresar al anestesiólogo</button>` : ''}
    ${tiene('aprobador') && c.Estado === 'Aprobado' ? `<button class="btn sec" onclick="rechazar(false)">Quitar aprobación</button>` : ''}
    ${tiene('aprobador') && ['Programado', 'Por_confirmar', 'Por_aprobar'].includes(c.Estado) ? `<button class="btn peligro" onclick="rechazar(true)">Excluir (no aplica)</button>` : ''}
    ${tiene('aprobador') && c.Estado === 'Excluido' ? `<button class="btn sec" onclick="accion('reabrir')">Reabrir</button>` : ''}
  </div>`;
}

async function conCaso(fn) {
  $('#detalle').classList.add('cargando');
  try { S.caso = await fn(); pintarCaso(); } catch (e) { toast(e.message, true); }
  $('#detalle').classList.remove('cargando');
}
const idCaso = () => S.caso.caso.Caso_ID;
function agregar() { const v = $('#nuevoProc').value; if (!v) return toast('Elige un procedimiento', true); conCaso(() => api('agregarLinea', { id: idCaso(), concepto: v })); }
function quitar(l) { conCaso(() => api('quitarLinea', { id: idCaso(), linea: l })); }
function mapear(l, concepto) {
  if (!concepto) return;
  const guardar = confirm('¿Guardar esta equivalencia para que la próxima vez se clasifique sola?');
  conCaso(() => api('mapearLinea', { id: idCaso(), linea: l, concepto, guardar }));
}
function marcar(d) { conCaso(() => api('marcar', Object.assign({ id: idCaso() }, d))); }
function toggleReint() {
  const c = S.caso.caso;
  if (c.Reintervencion === 'Sí') return marcar({ reintervencion: false });
  const ref = prompt('¿Qué cirugía se está reinterviniendo? (fecha y procedimiento original)');
  if (ref === null) return;
  marcar({ reintervencion: true, reintervencionRef: ref });
}
function accion(a) {
  conCaso(async () => { const r = await api(a, { id: idCaso() }); toast({ confirmar: 'Enviado a aprobación', aprobar: 'Aprobado', reclamar: 'Caso asignado a ti', reabrir: 'Caso reabierto' }[a] || 'Listo'); return r; });
}
function rechazar(excluir) {
  const m = prompt(excluir ? 'Motivo para excluir este caso:' : 'Motivo para regresarlo:');
  if (!m) return;
  conCaso(() => api('rechazar', { id: idCaso(), motivo: m, excluir }));
}
async function sincronizarAhora() {
  toast('Leyendo la agenda…');
  try { const r = await api('sincronizarAhora'); S.yo = await api('sesion'); toast(`Listo: ${r.nuevos} nuevos, ${r.actualizados} actualizados`); cargarVista(); } catch (e) { toast(e.message, true); }
}

/* ---------- Cobrar (anestesiólogo) ---------- */
function vistaCobrar() {
  const aprob = S.casos.filter(c => c.Estado === 'Aprobado' && String(c.Anestesiologo_Email).toLowerCase() === S.yo.email);
  const suma = aprob.filter(c => S.sel.has(c.Caso_ID)).reduce((s, c) => s + Number(c.Total), 0);
  marco(`<div class="hero"><div><div class="eyebrow">Factura</div><h1>Cobrar</h1></div></div>
  <div class="grid2"><div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">1 · Elige los casos aprobados</h3>
    ${aprob.length ? `<table><tbody>${aprob.map(c => `<tr><td style="width:28px"><input type="checkbox" ${S.sel.has(c.Caso_ID) ? 'checked' : ''} onchange="selCaso('${c.Caso_ID}',this.checked)"></td>
      <td><b>${esc(c.Paciente)}</b><br><span class="fecha">${esc(String(c.Fecha_Cirugia).slice(0, 10))} · ${esc(c.Caso_ID)}</span></td><td class="num">${mx(c.Total)}</td></tr>`).join('')}</tbody></table>
      <div style="margin-top:8px"><button class="chip" onclick="aprob_todos()">Seleccionar todos</button></div>` : '<div class="vacio">No tienes casos aprobados por cobrar.</div>'}
    </div></div>
    <div><div class="panel crema"><h3 style="font-size:19px">2 · Sube tu factura</h3>
      <p class="fecha">La factura debe sumar exactamente el total de los casos elegidos. Sube el XML (obligatorio) y el PDF.</p>
      <div class="desglose" style="background:#fff"><div class="tot"><span>Total a facturar</span><span>${mx(suma)}</span></div></div>
      <div class="campo"><label>XML del CFDI</label><input type="file" id="fxml" accept=".xml,text/xml,application/xml"></div>
      <div class="campo"><label>PDF</label><input type="file" id="fpdf" accept="application/pdf"></div>
      <button class="btn" ${suma > 0 ? '' : 'disabled'} onclick="enviarFactura()">Enviar a pago</button>
      <div id="resFactura"></div></div></div></div>
  <h3 style="font-size:21px;margin:16px 0 8px">Mis solicitudes de pago</h3>
  ${tablaSolicitudes(S.sols, false)}`);
}
function selCaso(id, on) { on ? S.sel.add(id) : S.sel.delete(id); pintar(); }
function aprob_todos() { S.casos.filter(c => c.Estado === 'Aprobado' && String(c.Anestesiologo_Email).toLowerCase() === S.yo.email).forEach(c => S.sel.add(c.Caso_ID)); pintar(); }
const leerB64 = f => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(f); });
async function enviarFactura() {
  const x = $('#fxml').files[0], p = $('#fpdf').files[0];
  if (!x) return toast('Falta el XML', true);
  if (x.size > 2e6 || (p && p.size > 8e6)) return toast('Archivo demasiado grande', true);
  $('#resFactura').innerHTML = '<div class="aviso">Validando la factura con el SAT…</div>';
  try {
    const r = await api('crearSolicitud', { casos: [...S.sel], xml: await leerB64(x), pdf: p ? await leerB64(p) : '' });
    S.sel.clear();
    toast('Factura aceptada · ' + r.solicitud);
    await cargarVista();
  } catch (e) { $('#resFactura').innerHTML = `<div class="aviso err">${esc(e.message)}</div>`; }
}

function tablaSolicitudes(lista, pagador) {
  if (!lista.length) return '<div class="vacio">Sin solicitudes.</div>';
  return `<table><thead><tr><th>Solicitud</th>${pagador ? '<th>Anestesiólogo</th>' : ''}<th>Casos</th><th>Factura</th><th class="num">Total</th><th>Estado</th>${pagador ? '<th></th>' : ''}</tr></thead><tbody>
  ${lista.map(s => `<tr><td><b>${esc(s.Solicitud_ID)}</b><br><span class="fecha">${esc(String(s.Creado_En).slice(0, 10))}</span></td>
    ${pagador ? `<td>${esc(s.Anestesiologo)}${s.CLABE ? `<br><span class="fecha">${esc(s.Banco)} · CLABE ${esc(s.CLABE)}</span>` : '<br><span class="sinmap">Sin CLABE registrada</span>'}</td>` : ''}
    <td class="fecha">${esc(String(s.Casos).split(',').length)} caso(s)</td>
    <td class="fecha">${s.XML_URL ? `<a href="${s.XML_URL}" target="_blank">XML</a>` : ''} ${s.PDF_URL ? `· <a href="${s.PDF_URL}" target="_blank">PDF</a>` : ''}<br>SAT: ${esc(s.Estado_SAT)}</td>
    <td class="num">${mx(s.Total_CFDI)}</td>
    <td><span class="estado e-${s.Estado === 'Pagada' ? 'Pagado' : (s.Estado === 'Rechazada' ? 'Rechazado' : 'En_cobro')}">${ESTADO_TXT[s.Estado] || s.Estado}</span>${s.Comprobante_URL ? `<br><a class="fecha" href="${s.Comprobante_URL}" target="_blank">Comprobante</a>` : ''}${s.Motivo ? `<br><span class="fecha">${esc(s.Motivo)}</span>` : ''}</td>
    ${pagador ? `<td>${s.Estado === 'Por_pagar' ? `<button class="btn" onclick="pagar('${s.Solicitud_ID}')">Registrar pago</button><br><button class="chip" style="margin-top:6px" onclick="rechazarSol('${s.Solicitud_ID}')">Rechazar</button>` : ''}</td>` : ''}</tr>`).join('')}
  </tbody></table>`;
}

/* ---------- Pagos ---------- */
function vistaPagos() {
  const por = S.sols.filter(s => s.Estado === 'Por_pagar');
  const total = por.reduce((a, s) => a + Number(s.Total_CFDI), 0);
  if (!S.filtro) S.filtro = 'Por_pagar';
  const lista = S.filtro === 'todas' ? S.sols : S.sols.filter(s => s.Estado === S.filtro);
  marco(`<div class="hero"><div><div class="eyebrow">Tesorería</div><h1>Pagos a anestesiología</h1></div>
    <div class="kpi" style="min-width:220px"><div class="l">Por pagar</div><div class="v">${mx(total)}</div></div></div>
    ${chips([['Por_pagar', 'Por pagar'], ['Pagada', 'Pagadas'], ['Rechazada', 'Rechazadas'], ['todas', 'Todas']], { Por_pagar: por.length })}
    <div class="aviso">Haz la SPEI desde el banco y después registra el pago aquí con el comprobante. La app no mueve dinero.</div>
    ${tablaSolicitudes(lista, true)}
    <input type="file" id="fcomp" accept="application/pdf,image/*" style="display:none">`);
}
function pagar(id) {
  const inp = $('#fcomp');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const ref = prompt('Referencia o clave de rastreo de la SPEI (opcional):') || '';
    toast('Registrando pago…');
    try { await api('marcarPagada', { id, comprobante: await leerB64(f), tipo: f.type, referencia: ref }); toast('Pago registrado'); cargarVista(); } catch (e) { toast(e.message, true); }
  };
  inp.click();
}
async function rechazarSol(id) {
  const m = prompt('Motivo del rechazo (la factura se regresa y los casos vuelven a "aprobado"):'); if (!m) return;
  try { await api('rechazarSolicitud', { id, motivo: m }); toast('Solicitud rechazada'); cargarVista(); } catch (e) { toast(e.message, true); }
}

/* ---------- Equivalencias ---------- */
function vistaEquiv() {
  const tab = {}; S.cat.tabulador.forEach(t => tab[t.id] = t);
  const orden = [...S.eqs].sort((a, b) => (a.Concepto_ID ? 1 : 0) - (b.Concepto_ID ? 1 : 0) || (Number(b.Veces_Visto) || 0) - (Number(a.Veces_Visto) || 0));
  const sin = orden.filter(e => !e.Concepto_ID).length;
  const opt = sel => `<option value="">— Sin mapear —</option>` + S.cat.tabulador.filter(t => t.tipo !== 'Cargo').map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.categoria)} · ${esc(t.concepto)}</option>`).join('');
  marco(`<div class="hero"><div><div class="eyebrow">Agenda → tabulador</div><h1>Equivalencias</h1></div>
    <div class="fecha">${sin} nombre(s) sin mapear</div></div>
    <p class="fecha">Cada nombre comercial de la agenda se traduce a un renglón del tabulador. Los nombres nuevos aparecen aquí arriba, sin mapear, hasta que los clasifiques.</p>
    <table><thead><tr><th>Como viene en la agenda</th><th>Renglón del tabulador</th><th class="num">Veces</th><th>Notas</th></tr></thead><tbody>
    ${orden.map(e => `<tr><td>${esc(e.Nombre_Agenda)}</td><td><select style="padding:6px;border:1px solid ${e.Concepto_ID ? 'var(--linea)' : 'var(--error)'};max-width:320px" onchange="guardarEq(this,${JSON.stringify(String(e.Nombre_Agenda)).replace(/"/g, '&quot;')})">${opt(e.Concepto_ID)}</select></td>
      <td class="num">${esc(e.Veces_Visto || 0)}</td><td class="fecha">${esc(e.Notas || '')}</td></tr>`).join('')}
    </tbody></table>`);
}
async function guardarEq(sel, nombre) {
  if (!sel.value) return;
  try { S.eqs = await api('guardarEquivalencia', { nombre, concepto: sel.value }); toast('Guardado'); pintar(); } catch (e) { toast(e.message, true); }
}

/* ---------- Tablero ---------- */
function vistaTablero() {
  const t = S.tablero, e = t.porEstado;
  const k = (s) => e[s] || { n: 0, total: 0 };
  const meses = Object.keys(t.porMes).sort().reverse();
  const an = Object.keys(t.porAnest);
  marco(`<div class="hero"><div><div class="eyebrow">Resumen</div><h1>Tablero</h1></div><div class="fecha">Última lectura de agenda: ${esc(t.ultimaSinc || '—')}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Por confirmar</div><div class="v">${mx(k('Por_confirmar').total)}</div><div class="fecha">${k('Por_confirmar').n} casos</div></div>
    <div class="kpi"><div class="l">Por aprobar</div><div class="v">${mx(k('Por_aprobar').total)}</div><div class="fecha">${k('Por_aprobar').n} casos</div></div>
    <div class="kpi"><div class="l">Aprobado sin factura</div><div class="v">${mx(k('Aprobado').total)}</div><div class="fecha">${k('Aprobado').n} casos</div></div>
    <div class="kpi"><div class="l">Facturado por pagar</div><div class="v">${mx(k('En_cobro').total)}</div><div class="fecha">${k('En_cobro').n} casos</div></div>
    <div class="kpi"><div class="l">Pagado</div><div class="v">${mx(k('Pagado').total)}</div><div class="fecha">${k('Pagado').n} casos</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Por anestesiólogo</h3>
      ${an.length ? `<table><thead><tr><th>Anestesiólogo</th><th class="num">Pendiente</th><th class="num">Pagado</th></tr></thead><tbody>${an.map(n => `<tr><td>${esc(n)}</td><td class="num">${mx(t.porAnest[n].pendiente)}</td><td class="num">${mx(t.porAnest[n].pagado)}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Sin datos</div>'}</div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Pagado por mes de cirugía</h3>
      ${meses.length ? `<table><tbody>${meses.map(m => `<tr><td>${esc(m)}</td><td class="num">${mx(t.porMes[m])}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Todavía no hay pagos registrados.</div>'}</div>
  </div>`);
}

/* ---------- Arranque ---------- */
(function () {
  let tok = null;
  try { tok = sessionStorage.getItem('ane_tok'); } catch (e) { }
  if (tok) entrar(tok); else pintarLogin();
})();
</script>
</body>
</html>
