<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honorarios de Anestesia — Dr. Miguel Soto</title>
<link rel="icon" href="logo_ms_black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Sistema visual compartido con Cobros y AltaPacientes */
:root {
  --bg: #f1ebe1; --bg-soft: #ebe4d6; --card: #ffffff; --border: #d8cfbf; --border-soft: #ebe4d6;
  --text: #1a1a1a; --text-muted: #8a8378; --text-faint: #b3a895; --black: #1a1a1a;
  --accent: #b09372; --accent-dark: #8e7456; --success: #5a7a4e; --error: #a13a3a;
  --info: #4a6a82; --warn: #9a6b2e;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03); --shadow-md: 0 2px 12px rgba(0,0,0,0.06);
  --serif: 'Playfair Display', Georgia, serif; --sans: 'Inter', -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--sans); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; color: var(--text); }
button, input, select, textarea { font-family: var(--sans); }

/* TOP BAR */
.topbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; padding: 14px 24px; gap: 14px 18px; font-size: 0.72rem; color: var(--text-muted); background: var(--bg); }
.topbar .email { letter-spacing: 0.04em; }
.topbar .sep { opacity: .4; }
.topbar .salir { color: var(--text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; font-family: inherit; }
.topbar .salir:hover { color: var(--accent-dark); }
.topbar .salir.on { color: var(--accent-dark); text-decoration-thickness: 2px; font-weight: 600; }
.topbar .cnt { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.66rem; text-decoration: none; }

/* HERO */
.hero { background: var(--black); color: #fff; padding: 26px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.hero-left .step-num { font-family: var(--serif); font-size: 0.75rem; letter-spacing: 0.18em; color: #b3a895; }
.hero-left .step-name { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: #fff; margin-top: 2px; font-weight: 500; }
.hero-logo-img { height: 56px; width: auto; display: block; margin: 0 auto; }
.hero-right { text-align: right; }
.hero-right .doc-name { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; }
.hero-right .doc-title { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: #b3a895; margin-top: 2px; }

/* MAIN */
main { max-width: 980px; margin: 44px auto 80px; padding: 0 24px; }
.vhead { text-align: center; margin-bottom: 28px; }
.vhead h1 { font-size: 2rem; letter-spacing: -0.01em; margin-bottom: 8px; }
.vhead .eyebrow { color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; order: 2; }
.vhead > div:first-child { display: flex; flex-direction: column-reverse; }
.vhead .fecha, .vhead .lado { margin-top: 10px; color: var(--text-muted); font-size: 0.82rem; }
.vhead .kpi { display: inline-block; margin-top: 14px; }
.card, .panel { background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; padding: 28px; box-shadow: var(--shadow-sm); margin-bottom: 18px; }
.panel.crema { background: var(--bg-soft); }
.section-label, .panel h3, .card h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0 0 14px; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
.muted, .fecha { color: var(--text-muted); font-size: 0.8rem; }
.vacio { padding: 44px 0; text-align: center; color: var(--text-muted); font-style: italic; }

/* FILTROS */
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.chip { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 8px 14px; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; cursor: pointer; transition: all .15s; }
.chip:hover { background: var(--bg-soft); border-color: var(--accent); }
.chip.on { background: var(--black); color: #fff; border-color: var(--black); }

/* LISTA DE CASOS */
.lista { background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; box-shadow: var(--shadow-sm); overflow: hidden; }
.fila { display: grid; grid-template-columns: 112px 1fr 160px 116px 110px; gap: 14px; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .1s; }
.fila:last-child { border-bottom: 0; }
.fila > div { min-width: 0; }
.fila:hover { background: var(--bg-soft); }
.fila .pac { font-family: var(--serif); font-size: 1.05rem; }
.fila .proc { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila .monto { text-align: right; font-family: var(--serif); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.fila .fecha { font-size: 0.74rem; letter-spacing: .04em; }
.estado { display: inline-block; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; padding: 4px 9px; border-radius: 3px; background: var(--bg-soft); color: var(--text); }
.e-Por_confirmar { background: #fbf3e6; color: var(--warn); }
.e-Por_aprobar { background: #e8eef3; color: var(--info); }
.e-Aprobado { background: #e9f1e5; color: var(--success); }
.e-En_cobro { background: #efeaf3; color: #5d4d73; }
.e-Pagado { background: var(--black); color: #fff; }
.e-Excluido, .e-Rechazado { background: #f0ece5; color: var(--text-faint); }
.e-Programado { background: #fff; border: 1px solid var(--border); color: var(--text-muted); }

/* FORMULARIOS Y BOTONES */
label, .campo label { display: block; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
.campo { margin-bottom: 18px; }
input[type=text], input[type=number], input[type=file], select, textarea { width: 100%; padding: 12px 14px; font-size: 0.92rem; color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 3px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238a8378' d='M6 8L0 0h12z'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 26px; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; border: 0; border-radius: 3px; cursor: pointer; transition: all .15s; gap: 8px; background: var(--black); color: #fff; }
.btn:hover:not(:disabled) { background: #000; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.sec:hover { background: var(--bg-soft); border-color: var(--accent); }
.btn.peligro { background: transparent; color: var(--error); border: 1px solid #e7c3c3; }
.btn.peligro:hover { background: #fbe6e6; }
.link { background: none; border: 0; color: var(--accent-dark); cursor: pointer; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; padding: 0; }

/* AVISOS */
.aviso { background: #fbf3e6; border: 1px solid #e8d9bc; color: #8a6d3b; border-radius: 3px; padding: 14px 16px; margin: 12px 0; font-size: 0.86rem; }
.aviso.err { background: #fbe6e6; border-color: #e7c3c3; color: var(--error); }
.aviso.ok { background: #e7f6ec; border-color: #b7e0c4; color: #1e7e42; }

/* TABLAS */
table { width: 100%; border-collapse: collapse; }
th { font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); text-align: left; font-weight: 500; padding: 10px 8px; border-bottom: 1px solid var(--border); }
td { padding: 12px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; font-size: 0.88rem; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; padding: 3px 7px; border-radius: 3px; background: var(--bg-soft); color: var(--text-muted); white-space: nowrap; }
.tag.ag { background: #e8eef3; color: var(--info); } .tag.an { background: #fbf3e6; color: var(--warn); } .tag.ap { background: #e9f1e5; color: var(--success); }
.tachado td { opacity: .4; text-decoration: line-through; }
.sinmap { color: var(--error); font-weight: 500; }

/* TABLERO */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; padding: 20px; box-shadow: var(--shadow-sm); text-align: center; }
.kpi .l { font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
.kpi .v { font-family: var(--serif); font-size: 1.7rem; margin: 6px 0 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* DETALLE DEL CASO (panel lateral) */
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 100000; }
.drawer.on { display: block; }
.drawer .hoja { position: absolute; right: 0; top: 0; bottom: 0; width: min(660px, 100%); background: var(--bg); overflow-y: auto; box-shadow: -8px 0 40px rgba(0,0,0,.18); }
.drawer .hoja-top { background: var(--black); color: #fff; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2; }
.drawer .hoja-top img { height: 38px; }
.cerrar { background: none; border: 0; color: #fff; font-size: 28px; line-height: 1; cursor: pointer; opacity: .8; }
.cerrar:hover { opacity: 1; }
#detalle { padding: 26px 28px 60px; }
#detalle h2 { font-size: 1.8rem; margin: 6px 0 4px; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; margin: 18px 0; background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; padding: 18px 20px; }
.meta > div { font-size: 0.9rem; }
.meta b { display: block; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); font-weight: 500; margin-bottom: 2px; }
#detalle h3 { font-size: 1.15rem; margin: 22px 0 10px; }
#detalle table { background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; }
.controles { background: var(--card); border: 1px solid var(--border-soft); border-radius: 4px; padding: 4px 20px; margin-top: 18px; }
.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.92rem; }
.ctrl:last-child { border-bottom: 0; }
.ctrl small { display: block; color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 32px; height: 32px; border: 1px solid var(--border); background: #fff; border-radius: 3px; cursor: pointer; font-size: 1rem; }
.stepper button:disabled { opacity: .4; cursor: not-allowed; }
.switch { position: relative; width: 42px; height: 24px; background: var(--border); border-radius: 12px; border: 0; flex: none; cursor: pointer; }
.switch.on { background: var(--black); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch.on::after { left: 21px; }
.switch:disabled { opacity: .4; cursor: not-allowed; }
.desglose { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 20px 22px; margin: 20px 0; }
.desglose div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
.desglose div span:first-child { color: var(--text-muted); }
.desglose .tot { border-bottom: 0; padding-top: 14px; font-family: var(--serif); font-size: 1.4rem; }
.desglose .tot span:first-child { color: var(--text); }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: #fff; border: 1px solid var(--border-soft); border-radius: 6px; padding: 48px 40px; max-width: 420px; width: 100%; text-align: center; box-shadow: var(--shadow-md); }
.login-card .login-logo-img { height: 96px; width: auto; margin: 0 auto 8px; display: block; }
.login-card .login-doc { font-size: 0.7rem; letter-spacing: 0.22em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 32px; }
.login-card h1 { font-size: 1.6rem; margin: 0 0 6px 0; }
.login-card .login-sub { color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 28px; }
.login-card .login-note { color: var(--text-muted); font-size: 0.78rem; margin-top: 24px; line-height: 1.5; font-style: italic; }
#gbtn { display: flex; justify-content: center; margin-top: 8px; }

.toast { position: fixed; bottom: 84px; z-index: 100001 !important; left: 50%; transform: translateX(-50%); background: var(--black); color: #fff; padding: 12px 20px; border-radius: 3px; font-size: 0.85rem; z-index: 300; display: none; max-width: 90%; box-shadow: var(--shadow-md); }
.toast.err { background: var(--error); }
.cargando { opacity: .5; pointer-events: none; }

@media (max-width: 720px) {
  .hero { padding: 18px 20px; grid-template-columns: 1fr; text-align: center; gap: 10px; }
  .hero-right, .hero-left { text-align: center; }
  main { margin: 24px auto 80px; padding: 0 14px; }
  .vhead h1 { font-size: 1.5rem; }
  .card, .panel { padding: 20px; }
  .fila { grid-template-columns: 1fr auto; grid-template-areas: 'pac monto' 'proc est' 'fecha an'; padding: 14px 16px; }
  .fila > div:nth-child(1) { grid-area: fecha; } .fila > div:nth-child(2) { grid-area: pac; }
  .fila .an { grid-area: an; text-align: right; } .fila .est { grid-area: est; text-align: right; } .fila .monto { grid-area: monto; }
  .grid2, .meta { grid-template-columns: 1fr; }
  #detalle { padding: 20px 16px 60px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)cerrarCaso()"><div class="hoja">
  <div class="hoja-top"><img src="logo_ms_white.png" alt="MS"><button class="cerrar" onclick="cerrarCaso()" aria-label="Cerrar">×</button></div>
  <div id="detalle"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyQzreXfVYijommhkd4mdnejSD_j5qr-ZT2fk5Ud9TEZhbkhcmgxM5xJip80vDCXy30Zg/exec';
const CLIENT_ID = '634352012698-b47t3ed3tvd4d1g7l30l68bd6e5s0ri4.apps.googleusercontent.com';

const S = { token: null, yo: null, cat: null, vista: '', filtro: '', casos: [], sols: [], eqs: [], tablero: null, caso: null, sel: new Set() };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mx = n => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const ESTADO_TXT = { Programado: 'Programado', Por_confirmar: 'Por confirmar', Por_aprobar: 'Por aprobar', Aprobado: 'Aprobado', En_cobro: 'En cobro', Pagado: 'Pagado', Excluido: 'Excluido', Rechazado: 'Rechazado', Por_pagar: 'Por pagar', Pagada: 'Pagada', Rechazada: 'Rechazada' };
const tiene = r => S.yo && S.yo.roles.includes(r);

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2600); }

async function api(accion, datos) {
  const res = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken: S.token, accion, datos: datos || {} }) });
  const j = await res.json();
  if (!j.ok) {
    if (/Sesión|Token|vencida/i.test(j.error)) { salir(true); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ---------- Sesión ---------- */
function pintarLogin(msg) {
  $('#app').innerHTML = `<div class="login-screen"><div class="login-card">
    <img src="logo_ms_black.png" alt="Dr. Miguel Soto" class="login-logo-img">
    <div class="login-doc">Dr. Miguel Soto · Cirujano Plástico</div>
    <h1>Honorarios de Anestesia</h1>
    <div class="login-sub">Inicia sesión con tu cuenta autorizada</div>
    ${msg ? `<div class="aviso err">${esc(msg)}</div>` : ''}
    <div id="gbtn"></div>
    <div class="login-note">Sólo cuentas autorizadas por el Dr. Soto pueden entrar.</div>
  </div></div>`;
  const ini = () => {
    if (!window.google || !google.accounts) return setTimeout(ini, 150);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => entrar(r.credential), auto_select: true });
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'es' });
    google.accounts.id.prompt();
  };
  ini();
}

async function entrar(token) {
  S.token = token;
  try { sessionStorage.setItem('ane_tok', token); } catch (e) { }
  try {
    S.yo = await api('sesion');
    S.cat = await api('catalogo');
    S.vista = tiene('aprobador') ? 'aprobar' : (tiene('pagador') ? 'pagos' : 'mis');
    await cargarVista();
  } catch (e) { S.token = null; pintarLogin(e.message); }
}

function salir(vencida) {
  S.token = null; S.yo = null;
  try { sessionStorage.removeItem('ane_tok'); } catch (e) { }
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  pintarLogin(vencida ? 'Tu sesión venció. Vuelve a entrar.' : '');
}

/* ---------- Estructura ---------- */
function tabs() {
  const t = [];
  if (tiene('anestesiologo')) { t.push(['mis', 'Mis casos']); t.push(['cobrar', 'Cobrar']); }
  if (tiene('aprobador')) { t.push(['aprobar', 'Por aprobar']); t.push(['todos', 'Todos los casos']); t.push(['equiv', 'Equivalencias']); }
  if (tiene('pagador')) t.push(['pagos', 'Pagos']);
  t.push(['tablero', 'Tablero']);
  return t;
}

const NOMBRE_VISTA = { mis: 'Mis casos', cobrar: 'Cobrar', aprobar: 'Por aprobar', todos: 'Todos los casos', equiv: 'Equivalencias', pagos: 'Pagos', tablero: 'Tablero' };
function marco(contenido) {
  $('#app').innerHTML = `<header class="topbar">
    <span class="email">${esc(S.yo.email)}</span><span class="sep">·</span>
    ${tabs().map(([k, n]) => `<button class="salir ${S.vista === k ? 'on' : ''}" onclick="irA('${k}')">${n.toLowerCase()}</button>`).join('')}
    <span class="sep">·</span><button class="salir" onclick="salir()">salir</button>
  </header>
  <div class="hero">
    <div class="hero-left"><div class="step-num">HONORARIOS DE ANESTESIA</div><div class="step-name">${esc(NOMBRE_VISTA[S.vista] || '')}</div></div>
    <img src="logo_ms_white.png" alt="MS" class="hero-logo-img">
    <div class="hero-right"><div class="doc-name">Dr. Miguel Soto</div><div class="doc-title">Cirujano Plástico Certificado</div></div>
  </div>
  <main>${contenido}</main>`;
}

async function irA(v) { S.vista = v; S.filtro = ''; S.sel.clear(); S.selPag = ''; await cargarVista(); }

async function cargarVista() {
  marco('<div class="vacio">Cargando…</div>');
  try {
    if (['mis', 'aprobar', 'todos', 'cobrar'].includes(S.vista)) S.casos = await api('casos');
    if (S.vista === 'pagos' || S.vista === 'cobrar') S.sols = await api('solicitudes');
    if (S.vista === 'equiv') S.eqs = await api('equivalencias');
    if (S.vista === 'tablero') S.tablero = await api('tablero');
    pintar();
  } catch (e) { marco(`<div class="aviso err">${esc(e.message)}</div>`); }
}

function pintar() {
  const v = S.vista;
  if (v === 'mis') return vistaMis();
  if (v === 'aprobar') return vistaAprobar();
  if (v === 'todos') return vistaTodos();
  if (v === 'cobrar') return vistaCobrar();
  if (v === 'pagos') return vistaPagos();
  if (v === 'equiv') return vistaEquiv();
  if (v === 'tablero') return vistaTablero();
}

/* ---------- Listas de casos ---------- */
function nombreAnest(email) {
  if (!email) return 'Sin asignar';
  const a = (S.cat.anestesiologos || []).find(x => x.email.toLowerCase() === String(email).toLowerCase());
  return a ? a.nombre : email;
}

function pagador(id) { return (S.cat.pagadores || []).find(p => p.id === id); }
function nombrePag(id) { const p = pagador(id); return p ? p.nombre : 'Por definir'; }

function filaCaso(c, opts = {}) {
  const sm = Number(c.Sin_Mapear) > 0 ? ' <span class="sinmap">· sin clasificar</span>' : '';
  return `<div class="fila" onclick="abrirCaso('${c.Caso_ID}')">
    <div class="fecha">${esc(String(c.Fecha_Cirugia).slice(0, 10))}<br>${c.Pagador ? esc(c.Sede || nombrePag(c.Pagador)) : (c.Estado === 'Excluido' ? esc(c.Sede || '') : '<span class="sinmap">¿Quién paga?</span>')}</div>
    <div><div class="pac">${esc(c.Paciente)}</div><div class="proc">${esc(c.Texto_Agenda || '')}${sm}</div></div>
    <div class="an fecha">${opts.anest ? esc(nombreAnest(c.Anestesiologo_Email)) : esc(c.Tipo_Anestesia || '')}</div>
    <div class="est"><span class="estado e-${c.Estado}">${ESTADO_TXT[c.Estado] || c.Estado}</span></div>
    <div class="monto">${mx(c.Total)}</div></div>`;
}

function chips(opciones, conteo) {
  return `<div class="chips">${opciones.map(([k, n]) => `<button class="chip ${S.filtro === k ? 'on' : ''}" onclick="S.filtro='${k}';pintar()">${n}${conteo[k] !== undefined ? ' · ' + conteo[k] : ''}</button>`).join('')}</div>`;
}

function vistaMis() {
  const mios = S.casos.filter(c => String(c.Anestesiologo_Email).toLowerCase() === S.yo.email);
  const libres = S.casos.filter(c => !c.Anestesiologo_Email && c.Estado === 'Por_confirmar');
  const grupos = { Por_confirmar: [], Por_aprobar: [], Aprobado: [], En_cobro: [], Pagado: [], Programado: [] };
  mios.forEach(c => { if (grupos[c.Estado]) grupos[c.Estado].push(c); });
  const conteo = {}; Object.keys(grupos).forEach(k => conteo[k] = grupos[k].length); conteo.libres = libres.length;
  if (!S.filtro) S.filtro = 'Por_confirmar';
  const lista = S.filtro === 'libres' ? libres : (grupos[S.filtro] || []);
  marco(`<div class="vhead"><div><div class="eyebrow">Anestesiología</div><h1>Mis casos</h1></div>
    <div class="fecha">Los casos se cargan solos de la agenda de cirugías.</div></div>
    ${chips([['Por_confirmar', 'Por confirmar'], ['Por_aprobar', 'En revisión'], ['Aprobado', 'Aprobados'], ['En_cobro', 'En cobro'], ['Pagado', 'Pagados'], ['Programado', 'Próximos'], ['libres', 'Sin asignar']], conteo)}
    ${S.filtro === 'libres' ? '<div class="aviso">Cirugías de la agenda sin anestesiólogo identificado. Si diste tú la anestesia, ábrela y márcala como tuya.</div>' : ''}
    <div class="lista">${lista.map(c => filaCaso(c)).join('') || '<div class="vacio">Nada por aquí.</div>'}</div>`);
}

function vistaAprobar() {
  const pend = S.casos.filter(c => c.Estado === 'Por_aprobar');
  const conf = S.casos.filter(c => c.Estado === 'Por_confirmar');
  const sinAsig = conf.filter(c => !c.Anestesiologo_Email);
  const sinMap = S.casos.filter(c => Number(c.Sin_Mapear) > 0 && ['Por_confirmar', 'Por_aprobar', 'Programado'].includes(c.Estado));
  const sinPag = S.casos.filter(c => !c.Pagador && ['Por_confirmar', 'Por_aprobar', 'Programado'].includes(c.Estado));
  if (!S.filtro) S.filtro = 'pend';
  const mapa = { pend, conf, sinAsig, sinMap, sinPag };
  marco(`<div class="vhead"><div><div class="eyebrow">Aprobación</div><h1>Por aprobar</h1></div>
    <div><button class="btn sec" onclick="sincronizarAhora()">Leer agenda ahora</button>
    <div class="fecha" style="margin-top:6px;text-align:right">Última lectura: ${esc(S.yo.ultimaSinc || '—')}</div></div></div>
    ${chips([['pend', 'Confirmados por el anestesiólogo'], ['conf', 'Esperando al anestesiólogo'], ['sinAsig', 'Sin anestesiólogo'], ['sinMap', 'Sin clasificar'], ['sinPag', 'Sin pagador']], { pend: pend.length, conf: conf.length, sinAsig: sinAsig.length, sinMap: sinMap.length, sinPag: sinPag.length })}
    <div class="lista">${(mapa[S.filtro] || []).map(c => filaCaso(c, { anest: true })).join('') || '<div class="vacio">Nada pendiente.</div>'}</div>`);
}

function vistaTodos() {
  const est = ['activos', 'Programado', 'Por_confirmar', 'Por_aprobar', 'Aprobado', 'En_cobro', 'Pagado', 'Excluido', 'todos'];
  const activos = S.casos.filter(c => c.Estado !== 'Excluido');
  const conteo = { activos: activos.length, todos: S.casos.length };
  est.forEach(e => { if (!(e in conteo)) conteo[e] = S.casos.filter(c => c.Estado === e).length; });
  if (!S.filtro) S.filtro = 'activos';
  const lista = S.filtro === 'activos' ? activos : (S.filtro === 'todos' ? S.casos : S.casos.filter(c => c.Estado === S.filtro));
  const nombres = { activos: 'Vigentes', todos: 'Todos' };
  marco(`<div class="vhead"><div><div class="eyebrow">Agenda de cirugías</div><h1>Todos los casos</h1></div></div>
  ${chips(est.map(e => [e, nombres[e] || ESTADO_TXT[e]]), conteo)}
  <div class="lista">${lista.map(c => filaCaso(c, { anest: true })).join('') || '<div class="vacio">Sin casos.</div>'}</div>`);
}

/* ---------- Detalle de caso ---------- */
async function abrirCaso(id) {

      ? `<select onchange="marcar({anestesiologo:this.value})" style="margin-top:4px;padding:6px;border:1px solid var(--linea)"><option value="">Sin asignar</option>${S.cat.anestesiologos.map(a => `<option value="${esc(a.email)}" ${a.email.toLowerCase() === String(c.Anestesiologo_Email).toLowerCase() ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select>`
      : esc(nombreAnest(c.Anestesiologo_Email))}</div>
    <div style="grid-column:1/-1"><b>Paga</b>${tiene('aprobador') && aprobEdita
      ? `<select onchange="marcar({pagador:this.value})" style="margin-top:4px;padding:6px;border:1px solid ${c.Pagador ? 'var(--linea)' : 'var(--error)'}"><option value="">Por definir</option>${(S.cat.pagadores || []).map(p => `<option value="${esc(p.id)}" ${p.id === c.Pagador ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>`
      : esc(nombrePag(c.Pagador))}</div>
  </div>
  ${!c.Pagador && c.Estado !== 'Excluido' ? `<div class="aviso err">${/renast/i.test(c.Sede || '') ? 'Cirugía en Renasté: falta decidir si la paga CLINICAS RENASTERE o la Dra. Carmen Damián.' : 'La agenda no dice la sede de esta cirugía.'} ${tiene('aprobador') ? 'Elige arriba quién paga antes de aprobar.' : 'El Dr. Soto indicará quién la paga.'}</div>` : ''}
  ${c.Motivo ? `<div class="aviso">${esc(c.Motivo)}</div>` : ''}
  ${!c.Anestesiologo_Email && tiene('anestesiologo') && c.Estado === 'Por_confirmar' ? `<div class="aviso">Este caso no tiene anestesiólogo en la agenda. <button class="btn" style="margin-left:8px" onclick="accion('reclamar')">Yo di esta anestesia</button></div>` : ''}

  <h3 style="font-size:19px;margin-top:8px">Procedimientos</h3>
  <table><thead><tr><th>Origen</th><th>Procedimiento</th><th class="num">Tabulador</th><th></th></tr></thead><tbody>
  ${lineas.map(l => `<tr class="${l.activa ? '' : 'tachado'}"><td>${tag(l.origen)}</td>
    <td>${esc(l.texto)}${l.concepto ? (l.conceptoNombre && l.conceptoNombre !== l.texto ? `<br><span class="fecha">→ ${esc(l.conceptoNombre)}</span>` : '') :

    <td class="num">${l.monto == null ? '—' : mx(l.monto)}</td>
    <td class="num">${(aprobEdita || (anestEdita && l.origen === 'Anestesiologo')) ? `<button class="btn sec" style="padding:4px 9px" onclick="quitar('${l.id}')">${l.activa ? 'Quitar' : 'Restaurar'}</button>` : ''}</td></tr>`).join('')}

    <div class="ctrl"><div>Reintervención<small>Hematoma o reoperación de una cirugía propia previa. Paga ${mx((S.cat.tabulador.find(t => t.id === 'X_REINT') || {}).monto)} en lugar de la base.</small>

    <div class="tot"><span>Total</span><span>${mx(c.Total)}</span></div>

    ${tiene('aprobador') && ['Por_aprobar', 'Por_confirmar'].includes(c.Estado) ? `<button class="btn" onclick="accion('aprobar')">Aprobar ${mx(c.Total)}</button><button class="btn sec" onclick="rechazar(false)">Regresar al anestesiólogo</button>` : ''}
    ${tiene('aprobador') && c.Estado === 'Aprobado' ? `<button class="btn sec" onclick="rechazar(false)">Quitar aprobación</button>` : ''}
    ${tiene('aprobador') && ['Programado', 'Por_confirmar', 'Por_aprobar'].includes(c.Estado) ? `<button class="btn peligro" onclick="rechazar(true)">Excluir (no aplica)</button>` : ''}
    ${tiene('aprobador') && c.Estado === 'Excluido' ? `<button class="btn sec" onclick="accion('reabrir')">Reabrir</button>` : ''}
  </div>`;
}

async function conCaso(fn) {
  $('#detalle').classList.add('cargando');
  try { S.caso = await fn(); pintarCaso(); } catch (e) { toast(e.message, true); }
  $('#detalle').classList.remove('cargando');
}
const idCaso = () => S.caso.caso.Caso_ID;
function agregar() { const v = $('#nuevoProc').value; if (!v) return toast('Elige un procedimiento', true); conCaso(() => api('agregarLinea', { id: idCaso(), concepto: v })); }
function quitar(l) { conCaso(() => api('quitarLinea', { id: idCaso(), linea: l })); }
function mapear(l, concepto) {
  if (!concepto) return;
  const guardar = confirm('¿Guardar esta equivalencia para que la próxima vez se clasifique sola?');
  conCaso(() => api('mapearLinea', { id: idCaso(), linea: l, concepto, guardar }));
}
function marcar(d) { conCaso(() => api('marcar', Object.assign({ id: idCaso() }, d))); }
function toggleReint() {
  const c = S.caso.caso;
  if (c.Reintervencion === 'Sí') return marcar({ reintervencion: false });
  const ref = prompt('¿Qué cirugía se está reinterviniendo? (fecha y procedimiento original)');
  if (ref === null) return;
  marcar({ reintervencion: true, reintervencionRef: ref });
}
function accion(a) {
  conCaso(async () => { const r = await api(a, { id: idCaso() }); toast({ confirmar: 'Enviado a aprobación', aprobar: 'Aprobado', reclamar: 'Caso asignado a ti', reabrir: 'Caso reabierto' }[a] || 'Listo'); return r; });
}
function rechazar(excluir) {
  const m = prompt(excluir ? 'Motivo para excluir este caso:' : 'Motivo para regresarlo:');
  if (!m) return;
  conCaso(() => api('rechazar', { id: idCaso(), motivo: m, excluir }));
}
async function sincronizarAhora() {
  toast('Leyendo la agenda…');
  try { const r = await api('sincronizarAhora'); S.yo = await api('sesion'); toast(`Listo: ${r.nuevos} nuevos, ${r.actualizados} actualizados`); cargarVista(); } catch (e) { toast(e.message, true); }
}

/* ---------- Cobrar (anestesiólogo) ---------- */
function vistaCobrar() {
  const aprob = S.casos.filter(c => c.Estado === 'Aprobado' && String(c.Anestesiologo_Email).toLowerCase() === S.yo.email);
  const grupos = {};
  aprob.forEach(c => { (grupos[c.Pagador || ''] = grupos[c.Pagador || ''] || []).push(c); });
  const selPag = S.selPag || '';
  const suma = aprob.filter(c => S.sel.has(c.Caso_ID)).reduce((s, c) => s + Number(c.Total), 0);
  const p = pagador(selPag);
  const receptor = p ? `<div class="desglose" style="background:#fff">
      <div><span>Razón social</span><span>${esc(p.razon || 'Pendiente: pídela al Dr. Soto')}</span></div>
      <div><span>RFC</span><span>${esc(p.rfc || 'Pendiente: pídelo al Dr. Soto')}</span></div>
      ${p.regimen ? `<div><span>Régimen fiscal</span><span>${esc(p.regimen)}</span></div>` : ''}
      ${p.cp ? `<div><span>C.P. fiscal</span><span>${esc(p.cp)}</span></div>` : ''}

    : `<div class="desglose" style="background:#fff"><div class="tot"><span>Total a facturar</span><span>${mx(0)}</span></div></div>`;
  const bloque = id => `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px">Paga: ${esc(nombrePag(id))}</div>
    <table><tbody>${grupos[id].map(c => `<tr><td style="width:28px"><input type="checkbox" ${S.sel.has(c.Caso_ID) ? 'checked' : ''} onchange="selCaso('${c.Caso_ID}',this.checked)"></td>
      <td><b>${esc(c.Paciente)}</b><br><span class="fecha">${esc(String(c.Fecha_Cirugia).slice(0, 10))} · ${esc(c.Sede || '')} · ${esc(c.Caso_ID)}</span></td><td class="num">${mx(c.Total)}</td></tr>`).join('')}</tbody></table>
    <div style="margin-top:8px"><button class="chip" onclick="aprob_todos('${id}')">Seleccionar todos</button></div></div>`;
  marco(`<div class="vhead"><div><div class="eyebrow">Factura</div><h1>Cobrar</h1></div></div>
  <div class="grid2"><div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">1 · Elige los casos aprobados</h3>
    <p class="fecha" style="margin-bottom:10px">Cada pagador es una razón social distinta: cada factura lleva casos de un solo pagador.</p>
    ${aprob.length ? Object.keys(grupos).map(bloque).join('') : '<div class="vacio">No tienes casos aprobados por cobrar.</div>'}
    </div></div>
    <div><div class="panel crema"><h3 style="font-size:19px">2 · Sube tu factura</h3>
      <p class="fecha">Emite la factura a nombre de estos datos, por el total exacto de los casos elegidos. Sube el XML (obligatorio) y el PDF.</p>
      ${receptor}
      <div class="campo"><label>XML del CFDI</label><input type="file" id="fxml" accept=".xml,text/xml,application/xml"></div>
      <div class="campo"><label>PDF</label><input type="file" id="fpdf" accept="application/pdf"></div>
      <button class="btn" ${suma > 0 && p && p.rfc ? '' : 'disabled'} onclick="enviarFactura()">Enviar a pago</button>
      <div id="resFactura"></div></div></div></div>
  <h3 style="font-size:21px;margin:16px 0 8px">Mis solicitudes de pago</h3>
  ${tablaSolicitudes(S.sols, false)}`);
}
function selCaso(id, on) {
  const c = S.casos.find(x => x.Caso_ID === id);
  const pid = c ? (c.Pagador || '') : '';
  if (on && S.sel.size && S.selPag !== pid) { S.sel.clear(); toast('Cada factura lleva casos de un solo pagador: cambié tu selección'); }
  on ? S.sel.add(id) : S.sel.delete(id);
  S.selPag = S.sel.size ? pid : '';
  pintar();
}
function aprob_todos(pid) {
  S.sel.clear(); S.selPag = pid;
  S.casos.filter(c => c.Estado === 'Aprobado' && (c.Pagador || '') === pid && String(c.Anestesiologo_Email).toLowerCase() === S.yo.email).forEach(c => S.sel.add(c.Caso_ID));
  pintar();
}
const leerB64 = f => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(f); });
async function enviarFactura() {
  const x = $('#fxml').files[0], p = $('#fpdf').files[0];
  if (!x) return toast('Falta el XML', true);
  if (x.size > 2e6 || (p && p.size > 8e6)) return toast('Archivo demasiado grande', true);
  $('#resFactura').innerHTML = '<div class="aviso">Validando la factura con el SAT…</div>';
  try {
    const r = await api('crearSolicitud', { casos: [...S.sel], xml: await leerB64(x), pdf: p ? await leerB64(p) : '' });
    S.sel.clear(); S.selPag = '';
    toast('Factura aceptada · ' + r.solicitud);
    await cargarVista();
  } catch (e) { $('#resFactura').innerHTML = `<div class="aviso err">${esc(e.message)}</div>`; }
}

function tablaSolicitudes(lista, pagador) {
  if (!lista.length) return '<div class="vacio">Sin solicitudes.</div>';
  return `<table><thead><tr><th>Solicitud</th>${pagador ? '<th>Anestesiólogo</th>' : ''}<th>Paga</th><th>Casos</th><th>Factura</th><th class="num">Total</th><th>Estado</th>${pagador ? '<th></th>' : ''}</tr></thead><tbody>
  ${lista.map(s => `<tr><td><b>${esc(s.Solicitud_ID)}</b><br><span class="fecha">${esc(String(s.Creado_En).slice(0, 10))}</span></td>
    ${pagador ? `<td>${esc(s.Anestesiologo)}${s.CLABE ? `<br><span class="fecha">${esc(s.Banco)} · CLABE ${esc(s.CLABE)}</span>` : '<br><span class="sinmap">Sin CLABE registrada</span>'}</td>` : ''}
    <td class="fecha">${esc(s.Pagador_Nombre || '—')}</td>
    <td class="fecha">${esc(String(s.Casos).split(',').length)} caso(s)</td>
    <td class="fecha">${s.XML_URL ? `<a href="${s.XML_URL}" target="_blank">XML</a>` : ''} ${s.PDF_URL ? `· <a href="${s.PDF_URL}" target="_blank">PDF</a>` : ''}<br>SAT: ${esc(s.Estado_SAT)}</td>
    <td class="num">${mx(s.Total_CFDI)}</td>
    <td><span class="estado e-${s.Estado === 'Pagada' ? 'Pagado' : (s.Estado === 'Rechazada' ? 'Rechazado' : 'En_cobro')}">${ESTADO_TXT[s.Estado] || s.Estado}</span>${s.Comprobante_URL ? `<br><a class="fecha" href="${s.Comprobante_URL}" target="_blank">Comprobante</a>` : ''}${s.Motivo ? `<br><span class="fecha">${esc(s.Motivo)}</span>` : ''}</td>
    ${pagador ? `<td>${s.Estado === 'Por_pagar' && s.Puedo_Pagar ? `<button class="btn" onclick="pagar('${s.Solicitud_ID}')">Registrar pago</button><br><button class="chip" style="margin-top:6px" onclick="rechazarSol('${s.Solicitud_ID}')">Rechazar</button>` : ''}</td>` : ''}</tr>`).join('')}
  </tbody></table>`;
}

/* ---------- Pagos ---------- */
function vistaPagos() {
  const por = S.sols.filter(s => s.Estado === 'Por_pagar' && s.Puedo_Pagar);
  const porPag = {};
  por.forEach(s => { porPag[s.Pagador_Nombre] = (porPag[s.Pagador_Nombre] || 0) + Number(s.Total_CFDI); });
  if (!S.filtro) S.filtro = 'Por_pagar';
  const lista = S.filtro === 'todas' ? S.sols : S.sols.filter(s => s.Estado === S.filtro);
  marco(`<div class="vhead"><div><div class="eyebrow">Tesorería</div><h1>Pagos a anestesiología</h1></div>
    <div>${Object.keys(porPag).length ? Object.keys(porPag).map(n => `<div class="kpi" style="min-width:220px;margin:0 6px 6px 0"><div class="l">Por pagar · ${esc(n)}</div><div class="v">${mx(porPag[n])}</div></div>`).join('') : `<div class="kpi" style="min-width:220px"><div class="l">Por pagar</div><div class="v">${mx(0)}</div></div>`}</div></div>
    ${chips([['Por_pagar', 'Por pagar'], ['Pagada', 'Pagadas'], ['Rechazada', 'Rechazadas'], ['todas', 'Todas']], { Por_pagar: por.length })}
    <div class="aviso">Haz la SPEI desde el banco y después registra el pago aquí con el comprobante. La app no mueve dinero.</div>
    ${tablaSolicitudes(lista, true)}
    <input type="file" id="fcomp" accept="application/pdf,image/*" style="display:none">`);
}
function pagar(id) {
  const inp = $('#fcomp');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const ref = prompt('Referencia o clave de rastreo de la SPEI (opcional):') || '';
    toast('Registrando pago…');
    try { await api('marcarPagada', { id, comprobante: await leerB64(f), tipo: f.type, referencia: ref }); toast('Pago registrado'); cargarVista(); } catch (e) { toast(e.message, true); }
  };
  inp.click();
}
async function rechazarSol(id) {
  const m = prompt('Motivo del rechazo (la factura se regresa y los casos vuelven a "aprobado"):'); if (!m) return;
  try { await api('rechazarSolicitud', { id, motivo: m }); toast('Solicitud rechazada'); cargarVista(); } catch (e) { toast(e.message, true); }
}

/* ---------- Equivalencias ---------- */
function vistaEquiv() {
  const tab = {}; S.cat.tabulador.forEach(t => tab[t.id] = t);
  const orden = [...S.eqs].sort((a, b) => (a.Concepto_ID ? 1 : 0) - (b.Concepto_ID ? 1 : 0) || (Number(b.Veces_Visto) || 0) - (Number(a.Veces_Visto) || 0));
  const sin = orden.filter(e => !e.Concepto_ID).length;
  const opt = sel => `<option value="">— Sin mapear —</option>` + S.cat.tabulador.filter(t => t.tipo !== 'Cargo').map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.categoria)} · ${esc(t.concepto)}</option>`).join('');
  marco(`<div class="vhead"><div><div class="eyebrow">Agenda → tabulador</div><h1>Equivalencias</h1></div>
    <div class="fecha">${sin} nombre(s) sin mapear</div></div>
    <p class="fecha">Cada nombre comercial de la agenda se traduce a un renglón del tabulador. Los nombres nuevos aparecen aquí arriba, sin mapear, hasta que los clasifiques.</p>
    <table><thead><tr><th>Como viene en la agenda</th><th>Renglón del tabulador</th><th class="num">Veces</th><th>Notas</th></tr></thead><tbody>
    ${orden.map(e => `<tr><td>${esc(e.Nombre_Agenda)}</td><td><select style="padding:6px;border:1px solid ${e.Concepto_ID ? 'var(--linea)' : 'var(--error)'};max-width:320px" onchange="guardarEq(this,${JSON.stringify(String(e.Nombre_Agenda)).replace(/"/g, '&quot;')})">${opt(e.Concepto_ID)}</select></td>
      <td class="num">${esc(e.Veces_Visto || 0)}</td><td class="fecha">${esc(e.Notas || '')}</td></tr>`).join('')}
    </tbody></table>`);
}
async function guardarEq(sel, nombre) {
  if (!sel.value) return;
  try { S.eqs = await api('guardarEquivalencia', { nombre, concepto: sel.value }); toast('Guardado'); pintar(); } catch (e) { toast(e.message, true); }
}

/* ---------- Tablero ---------- */
function vistaTablero() {
  const t = S.tablero, e = t.porEstado;
  const k = (s) => e[s] || { n: 0, total: 0 };
  const meses = Object.keys(t.porMes).sort().reverse();
  const an = Object.keys(t.porAnest);
  marco(`<div class="vhead"><div><div class="eyebrow">Resumen</div><h1>Tablero</h1></div><div class="fecha">Última lectura de agenda: ${esc(t.ultimaSinc || '—')}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Por confirmar</div><div class="v">${mx(k('Por_confirmar').total)}</div><div class="fecha">${k('Por_confirmar').n} casos</div></div>
    <div class="kpi"><div class="l">Por aprobar</div><div class="v">${mx(k('Por_aprobar').total)}</div><div class="fecha">${k('Por_aprobar').n} casos</div></div>
    <div class="kpi"><div class="l">Aprobado sin factura</div><div class="v">${mx(k('Aprobado').total)}</div><div class="fecha">${k('Aprobado').n} casos</div></div>
    <div class="kpi"><div class="l">Facturado por pagar</div><div class="v">${mx(k('En_cobro').total)}</div><div class="fecha">${k('En_cobro').n} casos</div></div>
    <div class="kpi"><div class="l">Pagado</div><div class="v">${mx(k('Pagado').total)}</div><div class="fecha">${k('Pagado').n} casos</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Por anestesiólogo</h3>
      ${an.length ? `<table><thead><tr><th>Anestesiólogo</th><th class="num">Pendiente</th><th class="num">Pagado</th></tr></thead><tbody>${an.map(n => `<tr><td>${esc(n)}</td><td class="num">${mx(t.porAnest[n].pendiente)}</td><td class="num">${mx(t.porAnest[n].pagado)}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Sin datos</div>'}</div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Por pagador</h3>
      ${Object.keys(t.porPagador || {}).length ? `<table><thead><tr><th>Paga</th><th class="num">Pendiente</th><th class="num">Pagado</th></tr></thead><tbody>${Object.keys(t.porPagador).map(n => `<tr><td>${esc(n)}</td><td class="num">${mx(t.porPagador[n].pendiente)}</td><td class="num">${mx(t.porPagador[n].pagado)}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Sin datos</div>'}</div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Pagado por mes de cirugía</h3>
      ${meses.length ? `<table><tbody>${meses.map(m => `<tr><td>${esc(m)}</td><td class="num">${mx(t.porMes[m])}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Todavía no hay pagos registrados.</div>'}</div>
  </div>`);
}

/* ---------- Arranque ---------- */
(function () {
  let tok = null;
  try { tok = sessionStorage.getItem('ane_tok'); } catch (e) { }
  if (tok) entrar(tok); else pintarLogin();
})();
</script>
<!-- ============================================================
     MS UNIVERSE · Lanzador minimalista entre apps
     Pega este bloque COMPLETO (incluido el <script> del final)
     justo ANTES de </body> en cada app:
       altapacientes · cotizador · agenda · cobros · paquetes
     Es el MISMO código en todas. Detecta sola en cuál estás
     y la marca. En reposo es solo un círculo "MS".
     ============================================================ -->
<div id="ms-switch">
  <div class="ms-menu">
    <a data-app="altapacientes" href="https://altapacientes.miguelsotomd.com">Alta</a>
    <a data-app="cotizador"     href="https://cotizador.miguelsotomd.com">Cotizador</a>
    <a data-app="agenda"        href="https://agenda.miguelsotomd.com">Agenda</a>
    <a data-app="cobros"        href="https://cobros.miguelsotomd.com">Cobros</a>
    <a data-app="paquetes"      href="https://paquetes.miguelsotomd.com">Paquetes</a>
    <a data-app="anestesia"     href="https://anestesia.miguelsotomd.com">Anestesia</a>
  </div>
  <button class="ms-trigger" type="button" aria-label="Cambiar de app">
    <span class="ms-mark">MS</span>
  </button>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap');
  /* Posición: por defecto abajo-derecha. Para moverlo cambia bottom/right.
     Abajo-izquierda: left:20px; right:auto;  Arriba-derecha: top:20px; bottom:auto; */
  #ms-switch{ position:fixed; bottom:20px; right:20px; z-index:99999;
    font-family:'Jost',-apple-system,system-ui,sans-serif; display:flex;
    flex-direction:column; align-items:flex-end; gap:10px; }

  #ms-switch .ms-trigger{ width:48px; height:48px; border-radius:50%; cursor:pointer;
    background:rgba(7,9,8,.88); border:1px solid rgba(161,148,135,.35);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 28px -10px rgba(0,0,0,.6); transition:transform .3s, border-color .3s;
    display:flex; align-items:center; justify-content:center; padding:0; }
  #ms-switch .ms-trigger:hover{ border-color:rgba(161,148,135,.7); }
  #ms-switch .ms-mark{ font-size:15px; font-weight:400; letter-spacing:.12em; color:#F4F2F1; }
  #ms-switch.open .ms-trigger{ transform:rotate(90deg); border-color:#A19487; }

  #ms-switch .ms-menu{ display:flex; flex-direction:column; align-items:flex-end; gap:7px;
    opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .28s, transform .28s; }
  #ms-switch.open .ms-menu{ opacity:1; pointer-events:auto; transform:translateY(0); }
  #ms-switch .ms-menu a{ text-decoration:none; color:#F4F2F1; font-size:12.5px; font-weight:300;
    letter-spacing:.14em; text-transform:uppercase; padding:9px 16px; border-radius:999px;
    background:rgba(7,9,8,.88); border:1px solid rgba(161,148,135,.22);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 22px -12px rgba(0,0,0,.6); white-space:nowrap; transition:background .25s,color .25s; }
  #ms-switch .ms-menu a:hover{ background:rgba(161,148,135,.18); color:#fff; }
  #ms-switch .ms-menu a.ms-active{ background:#A19487; color:#070908; font-weight:500; pointer-events:none; }
</style>

<script>
  (function(){
    var box = document.getElementById('ms-switch');
    if(!box) return;
    var trigger = box.querySelector('.ms-trigger');
    var sub = location.hostname.split('.')[0]; // altapacientes | cotizador | agenda | cobros | paquetes
    box.querySelectorAll('.ms-menu a').forEach(function(a){
      if (a.getAttribute('data-app') === sub) a.classList.add('ms-active');
    });
    trigger.addEventListener('click', function(e){ e.stopPropagation(); box.classList.toggle('open'); });
    document.addEventListener('click', function(){ box.classList.remove('open'); });
  })();
</script>
</body>
</html>
